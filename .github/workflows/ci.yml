name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Cache Atlas deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-atlas-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-atlas-

      - name: Add Atlas to PATH
        run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Atlas
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -

      - name: Check Atlas version
        run: atlas -v

      - name: Install dependencies
        run: |
          # A restored checkout may predate a newly pinned dependency commit.
          atlas update binny
          atlas install

      - name: Check out the BIF compiler
        uses: actions/checkout@v4
        with:
          repository: nim-lang/Nim
          ref: 8f1a8f6342642933c07be49b7250364cb8184ab6
          path: deps/nim-devel

      - name: Build the BIF compiler
        working-directory: deps/nim-devel
        run: ./build_all.sh

      - name: Verify incremental frontend companions
        working-directory: deps/nim-devel
        run: |
          test -x bin/nifler
          test -x bin/nifmake

      - name: Run tests
        run: |
          export PATH="$GITHUB_WORKSPACE/deps/nim-devel/bin:$PATH"
          atlas-run tests --nim=deps/nim-devel/bin/nim
